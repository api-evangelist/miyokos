name: Miyokos
description: >-
  Miyoko's Creamery (miyokos.com) is a plant-based dairy company in the
  planetary-health sector, backed by Obvious Ventures, making vegan butter and
  cheese from cultured cashews, oats, and legumes. The company does not publish a
  first-party developer REST API; its digital surface is a Shopify-hosted
  storefront. That storefront exposes a genuine agent-commerce surface: a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a
  hosted shopping MCP endpoint for search/cart/checkout, Shopify Customer Account
  OIDC/OAuth for identity, and an /llms.txt with agent instructions. This profile
  was enriched by probing that public surface.
